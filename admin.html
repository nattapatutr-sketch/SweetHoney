<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Sweet Honey</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific touches for admin.html */
    .page-head h1 {
      font-size: var(--text-2xl);
      line-height: 1.4;
    }

    /* Table scrolls sideways inside its own box on small screens */
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: var(--hairline) solid var(--line);
    }
    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: var(--text-sm);
    }
    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--hairline) solid var(--line);
    }
    #ordersTable th {
      background: var(--cream-deep);
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
    }
    #ordersTable td {
      color: var(--ink-soft);
    }
    #ordersTable td:first-child {
      white-space: nowrap;
    }
    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Sweet Honey</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="page-head section-head">
          <h1>รายการสั่งซื้อ</h1>
          <p>รายการล่าสุดแสดงก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Sweet Honey</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
