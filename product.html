<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สินค้าทั้งหมด — Sweet Honey</title>
  <meta name="description" content="สินค้า Sweet Honey ทั้งหมด เลือกดูตามรูปแบบ ขวดใหญ่ ขวดเล็ก และหลอดบีบ">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific touches for product.html */
    .nav a[aria-current="page"] { color: var(--ink); }
    .nav a[aria-current="page"]::after { transform: scaleX(1); }

    .page-head h1 {
      font-size: var(--text-2xl);
      line-height: 1.4;
    }

    /* Filter buttons are created by script.js inside #filter-bar */
    #filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }
    #filter-bar .btn {
      width: auto;
      padding: 0.6rem 1.75rem;
    }
    #filter-bar .btn.is-active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--cream);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Sweet Honey</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html" aria-current="page">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="page-head section-head">
          <h1>สินค้าทั้งหมด</h1>
          <p>เลือกน้ำผึ้ง Sweet Honey ในรูปแบบที่เหมาะกับการใช้งานของคุณ</p>
        </div>

        <div id="filter-bar"></div>
        <div id="product-list" class="product-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Sweet Honey</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
