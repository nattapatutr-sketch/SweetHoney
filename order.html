<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Sweet Honey</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันการสั่งซื้อน้ำผึ้ง Sweet Honey">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific touches for order.html */
    .page-head h1 {
      font-size: var(--text-2xl);
      line-height: 1.4;
    }

    .order-form {
      max-width: 36rem;
    }
    .field {
      margin-bottom: var(--space-4);
    }
    .field label {
      margin-bottom: 0.25rem;
    }
    textarea {
      resize: vertical;
      line-height: 1.7;
    }
    .order-form .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Sweet Honey</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="page-head section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <p>ตรวจสอบรายการและกรอกข้อมูลติดต่อ เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม</label>
            <input type="text" id="total" name="total">
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn--accent">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Sweet Honey</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
